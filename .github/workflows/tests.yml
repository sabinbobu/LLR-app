name: Tests
on:
  # Private repos on the free plan get 2,000 minutes/month and macOS bills at 10x (~200 real
  # minutes). Out of minutes, jobs die in seconds with no steps. So: PRs only (main is the PR
  # merged), skip docs-only changes, cancel superseded runs.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-tests:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        # The runner's Xcode ships different simulators than the dev machine, so don't hard-code a name.
        run: |
          NAME=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9A-Za-z ]+ \(' | head -1 | sed 's/ ($//')
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -scheme LLR -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO test | tee test.log | tail -n 200
      - name: Show compiler and test errors
        # The Test step only echoes the last 200 lines, which hides the first compile error.
        if: failure()
        run: grep -E "error:|failed|FAIL" test.log | sort -u | head -60 || true
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: test.log
