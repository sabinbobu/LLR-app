name: LLR
options:
  bundleIdPrefix: com.sabinbobu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LLR:
    type: application
    platform: iOS
    sources: [LLR]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sabinbobu.llr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LLR
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  LLRTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LLRTests]
    dependencies:
      - target: LLR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sabinbobu.llr.tests
schemes:
  LLR:
    build:
      targets:
        LLR: all
        LLRTests: [test]
    test:
      targets: [LLRTests]
