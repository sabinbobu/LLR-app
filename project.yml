name: LLR-App
options:
  bundleIdPrefix: com.sabinbobu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FXZ8F6VUDU
targets:
  LLR:
    type: application
    platform: iOS
    sources: [LLR]
    dependencies:
      - target: LLRWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sabinbobu.llr
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LLR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSCameraUsageDescription: LLR uses the camera to photograph meals so it can estimate their macros, and to add your own photos and videos to exercises.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: LLR records sound with the exercise videos you film.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    entitlements:
      path: LLR/LLR.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sabinbobu.llr
  LLRWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LLRWidgets
      - LLR/LiveActivity/Shared
    info:
      path: LLRWidgets/Info.plist
      properties:
        CFBundleDisplayName: LLR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sabinbobu.llr.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: LLRWidgets/LLRWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sabinbobu.llr
  LLRTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LLRTests]
    dependencies:
      - target: LLR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sabinbobu.llr.tests
schemes:
  LLR:
    build:
      targets:
        LLR: all
        LLRTests: [test]
    test:
      targets: [LLRTests]
